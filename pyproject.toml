[build-system]
#requires = ["setuptools>=61.0"]
#build-backend = "setuptools.build_meta"
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djangocms-baseplugins"
dynamic = ["version"]
dependencies = [
    "django",
    "django-cms",
    "django-filer",
]

#[project.optional-dependencies]
#filer = ["django-filer"]
#requests = ["requests"]

#[tool.setuptools]
## Use automatic package discovery to include the root package and all subpackages
#packages = { find = { include = ["djangocms_baseplugins*"] } }
#
#[tool.setuptools.dynamic]
#version = { attr = "djangocms_baseplugins.__version__" }

[tool.hatch.version]
path = "djangocms_baseplugins/__init__.py"

[tool.hatch.build]
include = ["/djangocms_baseplugins" ]


[tool.ruff]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
# B = Bugbear
# DJ = django
# T20 = print
select = [
  # pyflakes, pycodestyle
  "F", "E", "W",
  # mmcabe
  "C90",
  # isort
  "I",
  # pep8-naming
  # "N",
  # pyupgrade
  # "UP",
  # flake8-2020
  "YTT",
  # flake8-boolean-trap
  # "FBT",
  # flake8-bugbear
  # "B",
  # flake8-comprehensions
  "C4",
  # flake8-django
  "DJ",
  # flake8-pie
  # "PIE",
  # flake8-simplify
  # "SIM",
  # flake8-gettext
  "INT",
  # pygrep-hooks
  # "PGH",
  # pylint
  # "PL",
  # unused noqa
  "RUF100",
  # flake8-print
  "T20",
]
ignore = []
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    # "migrations",
]
per-file-ignores = {}

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.9
target-version = "py311"

[tool.ruff.mccabe]
max-complexity = 15
